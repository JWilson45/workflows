name: Cleanup GHCR Images Weekly

on:
  schedule:
    - cron: "20 16 * * 0"
  workflow_dispatch:
    inputs:
      execute:
        description: "Execute deletion (manual runs default to preview only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  dispatch-cleanup:
    runs-on: workflows-runner-set
    steps:
      - name: Verify Micromarketing read token
        env:
          MICROMARKETING_PR_READ_TOKEN: ${{ secrets.MICROMARKETING_PR_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MICROMARKETING_PR_READ_TOKEN" || {
            echo "MICROMARKETING_PR_READ_TOKEN is required to read the private CI catalog and protect open PR artifacts." >&2
            exit 1
          }

      - name: Checkout cleanup scripts
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/scripts/ghcr-cleanup

      - name: Checkout Micromarketing
        uses: actions/checkout@v6
        with:
          repository: JWilson45/micromarketing
          token: ${{ secrets.MICROMARKETING_PR_READ_TOKEN }}
          path: micromarketing
          fetch-depth: 1
          persist-credentials: false

      - name: Discover packages and dispatch cleanup
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const {
              coverageRows,
              diffCatalog,
              discoverMicromarketingImages,
              readCatalogImages,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ghcr-cleanup/discover.js`);
            const dispatchRef =
              context.payload?.repository?.default_branch ||
              process.env.GITHUB_REF_NAME ||
              "main";
            const micromarketingRoot = `${process.env.GITHUB_WORKSPACE}/micromarketing`;
            const catalogPath = `${micromarketingRoot}/.github/ci/catalog.json`;
            const catalog = JSON.parse(fs.readFileSync(catalogPath, "utf8"));
            const catalogImages = readCatalogImages(catalog);
            const imageNames = await discoverMicromarketingImages({
              github,
              sourceRoot: micromarketingRoot,
            });
            const drift = diffCatalog(imageNames, catalogImages);
            const rows = coverageRows(imageNames, catalogImages);

            await core.summary
              .addHeading("Weekly GHCR cleanup targets")
              .addRaw("Source: `ghcr.io/jwilson45/*` references in `JWilson45/micromarketing`, plus `mm-buildcache`.\n")
              .addRaw("The CI catalog is a coverage check, not the allowlist.\n\n")
              .addTable([
                [
                  { data: "Package", header: true },
                  { data: "Discovered", header: true },
                  { data: "In catalog", header: true },
                  { data: "Action", header: true },
                ],
                ...rows.map((row) => [
                  row.image,
                  row.inDiscovered ? "yes" : "no",
                  row.inCatalog ? "yes" : "no",
                  row.action,
                ]),
              ]);
            if (drift.missingFromGhcr.length > 0) {
              core.warning(
                `Catalog images not found as GHCR packages: ${drift.missingFromGhcr.join(", ")}`
              );
            }
            if (drift.extraInGhcr.length > 0) {
              core.info(`GHCR packages not in the CI catalog (still cleaned): ${drift.extraInGhcr.join(", ")}`);
            }
            await core.summary.write();

            const scheduled = context.eventName === "schedule";
            const execute = scheduled
              ? "true"
              : String(context.payload.inputs?.execute || "false").toLowerCase() === "true" ? "true" : "false";
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "cleanup-pr-images.yaml",
              ref: dispatchRef,
              inputs: {
                image_name: imageNames.join(","),
                pr_numbers: "",
                older_than_days: "7",
                execute,
                require_approval: scheduled ? "false" : "true",
                pr_repository: "JWilson45/micromarketing",
                protect_open_prs: "true",
              },
            });
            core.info(`Dispatched cleanup-pr-images.yaml on ref ${dispatchRef}; execute=${execute}; images=${imageNames.join(", ")}`);
