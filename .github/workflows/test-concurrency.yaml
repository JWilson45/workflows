name: Test Workflow Contracts
on:
  pull_request:
    paths:
      - '.github/workflows/build-images.yaml'
      - '.github/workflows/deploy-products.yaml'
      - '.github/workflows/build-and-deploy.yaml'
      - '.github/workflows/test-concurrency.yaml'
      - '.github/actions/plan-images/**'
      - '.github/scripts/workflow-contracts/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: workflows-runner-set
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check jq prerequisite
        run: jq --version
      - run: node --test .github/scripts/workflow-contracts/*.test.js
      - run: python3 .github/scripts/workflow-contracts/test_cache_plan.py -v
